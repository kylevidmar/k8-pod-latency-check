apiVersion: v1
kind: ServiceAccount
metadata:
  name: latency-tester-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-reader-executor
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: latency-tester-binding
subjects:
- kind: ServiceAccount
  name: latency-tester-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: pod-reader-executor
  apiGroup: rbac.authorization.k8s.io
