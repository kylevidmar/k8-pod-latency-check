apiVersion: v1
kind: Pod
metadata:
  name: network-latency-tester
spec:
  serviceAccountName: latency-tester-sa
  containers:
  - name: latency-tester
    image: k8s-latency-tester:latest
    imagePullPolicy: IfNotPresent
    command: ["sleep", "infinity"]
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "500m"
